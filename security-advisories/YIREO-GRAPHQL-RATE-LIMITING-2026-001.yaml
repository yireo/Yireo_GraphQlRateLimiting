id: YIREO-GRAPHQL-RATE-LIMITING-2026-001
published: "2026-11-25T00:00:00Z"
modified: "2026-11-26T00:00:00Z"
aliases: []
summary: GraphQL rate limiting can be bypassed with aliases, fragments or a disabled cache type
details: >
  The rate limiter identified GraphQL requests by the raw query and its fragment definitions, instead
  of by the root fields that were actually executed. An unauthenticated client could avoid being
  limited by renaming or reordering fragments, or by requesting the same root field several times
  under different aliases in one request. In addition, the counters were stored through the module
  cache type, so disabling that cache type silently disabled rate limiting altogether. Version 1.0.0
  resolves the executed operation, expands fragments, counts one hit per root field (aliases
  included) in a fixed window and stores the counters in the cache frontend directly under a
  per-client lock. The same fixes are backported to 0.0.6 for installations that are constrained to the
  0.0.x series.
